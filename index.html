<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Government Exam Practice Portal</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --secondary: #0284c7;
      --accent: #f59e0b;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
    }

    .header {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      padding: 1.5rem;
      text-align: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .container {
      max-width: 800px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      margin-bottom: 2rem;
    }

    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      transition: background 0.2s;
      width: 100%;
      margin-top: 1rem;
    }

    .btn:hover {
      background: var(--secondary);
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
    }

    input, select {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      box-sizing: border-box;
    }

    .hidden {
      display: none;
    }

    .option-btn {
      display: block;
      width: 100%;
      padding: 1rem;
      margin: 0.5rem 0;
      background: #f1f5f9;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      text-align: left;
      cursor: pointer;
      font-size: 1rem;
    }

    .option-btn.selected {
      border-color: var(--secondary);
      background: #e0f2fe;
    }

    .timer {
      font-size: 1.25rem;
      font-weight: bold;
      color: #dc2626;
      text-align: right;
      margin-bottom: 1rem;
    }

    .result-summary {
      text-align: center;
    }

    .result-score {
      font-size: 2.5rem;
      font-weight: bold;
      color: var(--primary);
    }

    .loader {
      text-align: center;
      font-weight: bold;
      color: var(--primary);
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Government Exam Practice Portal</h1>
    <p>સ્પર્ધાત્મક પરીક્ષાઓ માટે શ્રેષ્ઠ તૈયારી</p>
  </div>

  <div class="container">

    <!-- Loading Indicator -->
    <div id="loader" class="card loader hidden">
      ડેટા પ્રોસેસ થઈ રહ્યો છે, મહેરબાની કરીને રાહ જુઓ...
    </div>

    <!-- Login Box -->
    <div id="login-section" class="card">
      <h2>Student Login</h2>
      <div class="form-group">
        <label for="mobile">મોબાઈલ નંબર (Mobile Number):</label>
        <input type="text" id="mobile" placeholder="૧૦ આંકડાનો મોબાઈલ નંબર લખો">
      </div>
      <div class="form-group">
        <label for="password">પાસવર્ડ (Password):</label>
        <input type="password" id="password" placeholder="તમારો પાસવર્ડ લખો">
      </div>
      <button class="btn" onclick="handleLogin()">Login કરો</button>
    </div>

    <!-- Exam Dashboard -->
    <div id="dashboard-section" class="card hidden">
      <h2>Welcome, <span id="student-name"></span>!</h2>
      <p>નીચે આપેલા પેપર માંથી પરીક્ષા પસંદ કરો:</p>
      
      <div class="form-group">
        <label for="paper-select">પેપર પસંદ કરો (Select Paper):</label>
        <select id="paper-select">
          <option value="CCE Model Paper 1">CCE Model Paper 1 (ગણિત / રીઝનિંગ / ગુજરાતી / અંગ્રેજી)</option>
          <option value="GPSC General Studies Paper 1">GPSC General Studies Paper 1</option>
          <option value="Talati Special Paper 1">Talati Special Paper 1</option>
        </select>
      </div>

      <button class="btn" onclick="startExam()">પરીક્ષા શરૂ કરો (Start Exam)</button>
    </div>

    <!-- Question Section -->
    <div id="exam-section" class="card hidden">
      <div class="timer" id="timer">સમય: 10:00</div>
      <h3 id="question-text">પ્રશ્ન લોડ થઈ રહ્યો છે...</h3>
      <div id="options-container"></div>
      <button class="btn" id="next-btn" onclick="nextQuestion()">આગળનો પ્રશ્ન (Next)</button>
    </div>

    <!-- Result Section -->
    <div id="result-section" class="card hidden result-summary">
      <h2>પરીક્ષાનું પરિણામ (Exam Result)</h2>
      <div class="result-score" id="score-text">0 / 0</div>
      <p id="detailed-score"></p>
      <button class="btn" onclick="location.reload()">ફરીથી પરીક્ષા આપો</button>
    </div>

  </div>

  <script>
    // Google Apps Script Web App URL
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby3Uolq10K5Rwajy3J7Xu9O6pq9IMOGTVJECqLOcBzLKgD3EtefOTaVScdQe4e6-LCO/exec";

    // Sample Question Bank
    const sampleQuestions = [
      {
        question: "ગુજરાતનું રાજ્ય પક્ષી કયું છે?",
        options: ["મોર", "હંસ (ફ્લેમિંગો)", "પોપટ", "કબૂતર"],
        answer: 1
      },
      {
        question: "ભારતનું બંધારણ ક્યારે અમલમાં આવ્યું?",
        options: ["15 ઓગસ્ટ 1947", "26 જાન્યુઆરી 1950", "26 નવેમ્બર 1949", "2 ઓક્ટોબર 1969"],
        answer: 1
      },
      {
        question: "ગુજરાતની સૌથી મોટી નદી કઈ છે?",
        options: ["સાબરમતી", "તાપી", "મહી", "નર્મદા"],
        answer: 3
      }
    ];

    let currentUser = null;
    let currentQuestions = [];
    let currentQuestionIndex = 0;
    let userAnswers = [];
    let timerInterval = null;
    let timeRemaining = 600; // 10 minutes

    function showLoader(show) {
      document.getElementById('loader').classList.toggle('hidden', !show);
    }

    async function handleLogin() {
      const mobile = document.getElementById('mobile').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!mobile || !password) {
        alert("મહેરબાની કરીને મોબાઈલ નંબર અને પાસવર્ડ બંને દાખલ કરો.");
        return;
      }

      showLoader(true);

      try {
        const response = await fetch(`${SCRIPT_URL}?action=getUsers`);
        const users = await response.json();

        showLoader(false);

        if (users[mobile] && users[mobile].pass === password) {
          currentUser = { mobile: mobile, name: users[mobile].name };
          document.getElementById('student-name').innerText = currentUser.name;
          document.getElementById('login-section').classList.add('hidden');
          document.getElementById('dashboard-section').classList.remove('hidden');
        } else {
          alert("મોબાઈલ નંબર અથવા પાસવર્ડ ખોટો છે!");
        }
      } catch (error) {
        showLoader(false);
        console.error("Error logging in:", error);
        alert("લોગિન કરવામાં સમસ્યા આવી છે. કૃપા કરીને Google Sheet ની સેટિંગ્સ તપાસો.");
      }
    }

    function startExam() {
      document.getElementById('dashboard-section').classList.add('hidden');
      document.getElementById('exam-section').classList.remove('hidden');
      
      currentQuestions = sampleQuestions;
      currentQuestionIndex = 0;
      userAnswers = new Array(currentQuestions.length).fill(null);
      
      startTimer();
      loadQuestion();
    }

    function startTimer() {
      timerInterval = setInterval(() => {
        timeRemaining--;
        const minutes = Math.floor(timeRemaining / 60);
        const seconds = timeRemaining % 60;
        document.getElementById('timer').innerText = `સમય: ${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;

        if (timeRemaining <= 0) {
          clearInterval(timerInterval);
          submitExam();
        }
      }, 1000);
    }

    function loadQuestion() {
      const q = currentQuestions[currentQuestionIndex];
      document.getElementById('question-text').innerText = `${currentQuestionIndex + 1}. ${q.question}`;
      
      const container = document.getElementById('options-container');
      container.innerHTML = '';

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        if (userAnswers[currentQuestionIndex] === idx) {
          btn.classList.add('selected');
        }
        btn.innerText = opt;
        btn.onclick = () => selectOption(idx);
        container.appendChild(btn);
      });

      if (currentQuestionIndex === currentQuestions.length - 1) {
        document.getElementById('next-btn').innerText = "સબમિટ કરો (Submit)";
      } else {
        document.getElementById('next-btn').innerText = "આગળનો પ્રશ્ન (Next)";
      }
    }

    function selectOption(idx) {
      userAnswers[currentQuestionIndex] = idx;
      loadQuestion();
    }

    function nextQuestion() {
      if (currentQuestionIndex < currentQuestions.length - 1) {
        currentQuestionIndex++;
        loadQuestion();
      } else {
        clearInterval(timerInterval);
        submitExam();
      }
    }

    async function submitExam() {
      let correct = 0;
      let wrong = 0;
      let blank = 0;

      currentQuestions.forEach((q, idx) => {
        if (userAnswers[idx] === null) {
          blank++;
        } else if (userAnswers[idx] === q.answer) {
          correct++;
        } else {
          wrong++;
        }
      });

      const totalMarks = (correct * 1) - (wrong * 0.25); // 0.25 Negative marking

      document.getElementById('exam-section').classList.add('hidden');
      document.getElementById('result-section').classList.remove('hidden');

      document.getElementById('score-text').innerText = `${totalMarks} / ${currentQuestions.length}`;
      document.getElementById('detailed-score').innerText = `સાચા: ${correct} | ખોટા: ${wrong} | ખાલી: ${blank}`;

      const selectedPaper = document.getElementById('paper-select').value;

      showLoader(true);

      // Save Result to Google Sheet via Web App API
      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            action: 'saveResult',
            mobile: currentUser.mobile,
            paperTitle: selectedPaper,
            marks: totalMarks,
            correct: correct,
            wrong: wrong,
            blank: blank
          })
        });
      } catch (error) {
        console.error("Error saving result:", error);
      } finally {
        showLoader(false);
      }
    }
  </script>

</body>
</html>
